<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MyStore - Cart</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="top-header">
    <div class="logo"><a href="index.html">MyStore</a></div>
    <nav class="header-actions">
      <a href="index.html">Home</a>
      <a href="products.html">Products</a>
      <a href="cart.html">Cart (<span class="cart-count">0</span>)</a>
      <a href="orders.html">Orders</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <main class="container page-top">
    <section class="section-header">
      <h2>Your Cart</h2>
    </section>

    <div class="cart-layout">
      <div class="cart-table-box">
        <table>
          <thead>
            <tr>
              <th>Image</th>
              <th>Product</th>
              <th>Price</th>
              <th>Qty</th>
              <th>Total</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="cart-items"></tbody>
        </table>
      </div>

      <div class="cart-summary-box">
        <h3>Price Details</h3>
        <p>Subtotal: <span id="subtotal">$0</span></p>
        <p>Shipping: <span id="shipping">$0</span></p>
        <p><strong>Grand Total: <span id="grand-total">$0</span></strong></p>
        <a href="checkout.html" class="checkout-btn">Proceed to Checkout</a>
      </div>
    </div>
  </main>

  <footer class="footer">
    <p>© 2026 MyStore. All Rights Reserved.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
