<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MyStore - Payment</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="top-header">
    <div class="logo"><a href="index.html">MyStore</a></div>
    <nav class="header-actions">
      <a href="index.html">Home</a>
      <a href="products.html">Products</a>
      <a href="cart.html">Cart (<span class="cart-count">0</span>)</a>
      <a href="orders.html">Orders</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <main class="container page-top">
    <div class="page-card">
      <h2>Payment</h2>

      <form id="paymentForm">
        <div class="payment-option"><input type="radio" name="pay" value="Credit Card" required> Credit Card</div>
        <div class="payment-option"><input type="radio" name="pay" value="Debit Card"> Debit Card</div>
        <div class="payment-option"><input type="radio" name="pay" value="Net Banking"> Net Banking</div>
        <div class="payment-option"><input type="radio" name="pay" value="Cash on Delivery"> Cash on Delivery</div>

        <div id="card-details">
          <label for="cardNumber">Card Number</label>
          <input type="text" id="cardNumber" placeholder="1234123412341234" />

          <label for="expiry">Expiry</label>
          <input type="text" id="expiry" placeholder="MM/YY" />

          <label for="cvv">CVV</label>
          <input type="password" id="cvv" placeholder="123" />
        </div>

        <button type="submit">Confirm Payment</button>
      </form>
    </div>
  </main>

  <footer class="footer">
    <p>© 2026 MyStore. All Rights Reserved.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
