<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MyStore - Contact</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="top-header">
    <div class="logo"><a href="index.html">MyStore</a></div>
    <nav class="header-actions">
      <a href="index.html">Home</a>
      <a href="products.html">Products</a>
      <a href="cart.html">Cart (<span class="cart-count">0</span>)</a>
      <a href="orders.html">Orders</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <main class="container page-top">
    <div class="contact-layout">
      <div class="page-card">
        <h2>Get in Touch</h2>
        <form id="contactForm">
          <label for="contactName">Your Name</label>
          <input type="text" id="contactName" required />

          <label for="contactEmail">Email</label>
          <input type="email" id="contactEmail" required />

          <label for="contactMessage">Message</label>
          <textarea id="contactMessage" rows="6" required></textarea>

          <button type="submit">Send Message</button>
        </form>
      </div>

      <div class="contact-info-card">
        <h3>Our Store</h3>
        <p><strong>Address:</strong> 123 Market Street, Chennai, Tamil Nadu, India</p>
        <p><strong>Phone:</strong> +91-98765-43210</p>
        <p><strong>Email:</strong> support@mystore.com</p>
        <div class="map-box">
          <img src="assets/map_placeholder.jpg" alt="Map" />
        </div>
      </div>
    </div>
  </main>

  <footer class="footer">
    <p>© 2026 MyStore. All Rights Reserved.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
